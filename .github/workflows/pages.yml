name: Deploy OPERVYN to GitHub Pages

"on":
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build CMS-managed pages
        run: python scripts/build_pages.py

      - name: Assemble and validate Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          rsync -a \
            --exclude='/.git/' \
            --exclude='/.github/' \
            --exclude='/scripts/' \
            --exclude='/_site/' \
            --exclude='/.gitignore' \
            --exclude='/README_GITHUB_PAGES_CMS.md' \
            --exclude='/.cms-generated-files.json' \
            --exclude='__pycache__/' \
            --exclude='*.pyc' \
            ./ _site/
          touch _site/.nojekyll
          for file in index.html styles.css theme-redesign.css script.js site.js content/site.json content/pages.json admin/index.html admin/admin.js; do
            test -s "_site/$file" || { echo "Missing required file: $file"; exit 1; }
          done
          python -c "import json; json.load(open('_site/content/site.json', encoding='utf-8')); json.load(open('_site/content/pages.json', encoding='utf-8')); print('Content JSON files validated.')"

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
          include-hidden-files: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
