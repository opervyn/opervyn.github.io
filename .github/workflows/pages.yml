              elif item.is_file():
                  shutil.copy2(item, target)

          # Ensure GitHub Pages serves static files without running Jekyll.
          (output / ".nojekyll").write_text("", encoding="utf-8")

          required = [
              "index.html",
              "styles.css",
              "theme-redesign.css",
              "script.js",
              "site.js",
              "content/site.json",
              "content/pages.json",
              "admin/index.html",
              "admin/admin.js",
              "assets/opervyn-logo-new.webp",
              ".nojekyll",
          ]
          missing = [name for name in required if not (output / name).is_file()]
          if missing:
              raise SystemExit("Pages artifact is missing: " + ", ".join(missing))

          json.loads((output / "content/site.json").read_text(encoding="utf-8"))
          json.loads((output / "content/pages.json").read_text(encoding="utf-8"))
          if (output / ".github").exists() or (output / ".git").exists():
              raise SystemExit("Private repository metadata must not enter the Pages artifact")

          print("Verified clean OPERVYN Pages artifact:")
          for name in required:
              print(" -", name)
          PY

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
          include-hidden-files: true

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
